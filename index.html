function vecC(m,n){const A=[290,150],B=[190,35],k=m/(m+n),C=[A[0]+k*(B[0]-A[0]),A[1]+k*(B[1]-A[1])];return S(185,`<path d="M60 150H290L190 35Z" class="l"/><path d="M60 150L${C[0]} ${C[1]}" class="l" stroke-dasharray="5 3" style="stroke:var(--bad)"/><circle cx="${C[0]}" cy="${C[1]}" r="3.5" fill="var(--bad)"/>`+tx(46,166,'O')+tx(300,166,'A')+tx(190,26,'B')+tx(C[0]+8,C[1]+4,'C','start')+tx(175,168,'a')+tx(110,84,'b','end')+tx(150,128,'OC','middle','fill:var(--bad)')+tx((A[0]+C[0])/2+10,(A[1]+C[1])/2+2,m,'start','fill:var(--a)')+tx((C[0]+B[0])/2+10,(C[1]+B[1])/2-4,n,'start','fill:var(--a)'))}

{n:43,m:3,q:`<p>A car travels a distance of 150 km, correct to the nearest 5 km, in a time of 2 hours, correct to the nearest 0.1 hour.</p><p>Work out the upper bound for the average speed of the car. Give your answer correct to 3 significant figures. (3)</p>`,s:[`Nearest 5 km means ±2.5 km, so the largest possible distance is 150 + 2.5 = 152.5 km.`,`Nearest 0.1 hour means ±0.05 hour, so the smallest possible time is 2 − 0.05 = 1.95 hours.`,`Speed = distance ÷ time. For the largest speed use the largest distance and the smallest time.`,`Upper bound = 152.5 ÷ 1.95 = 78.205…`,`= 78.2 km/h (3 s.f.)`],a:`78.2 km/h`,t:`Using 2.05 hours gives the lower bound, not the upper bound.`},
{n:44,m:4,q:`<p>O is the origin. OA = 4a and OB = 4b. M is the midpoint of OA. N is the midpoint of OB.</p><p>Show that MN is parallel to AB, and find the ratio of the length of MN to the length of AB. (4)</p>`,s:[`M is the midpoint of OA, so OM = ½ × 4a = 2a. N is the midpoint of OB, so ON = ½ × 4b = 2b.`,`MN = MO + ON = −2a + 2b = 2(b − a).`,`AB = AO + OB = −4a + 4b = 4(b − a).`,`MN = ½ × AB, so MN is a multiple of AB: the lines are <b>parallel</b>.`,`MN is half the length of AB, so the ratio MN : AB = <b>1 : 2</b>.`],a:`MN = ½AB, so MN is parallel to AB; ratio 1 : 2`},
{n:45,m:2,q:`<p>Simplify (x³ × x⁻⁵) ÷ x⁻⁴ (2)</p>`,s:[`Add the powers when multiplying: x³ × x⁻⁵ = x³⁺⁽⁻⁵⁾ = x⁻².`,`Subtract the powers when dividing: x⁻² ÷ x⁻⁴ = x⁻²⁻⁽⁻⁴⁾.`,`−2 − (−4) = −2 + 4 = 2.`,`Answer: x².`],a:`x²`,t:`Subtracting a negative power means adding.`},
{n:46,m:3,q:`<p>In a survey of 40 students, 22 study Physics, 18 study Chemistry and 8 study both Physics and Chemistry.</p><p>A student is chosen at random. Work out the probability that the student studies Physics but not Chemistry. (3)</p>`,s:[`Draw a Venn diagram. The overlap (both subjects) is 8.`,`Physics only = 22 − 8 = 14. Chemistry only = 18 − 8 = 10.`,`Check: 14 + 8 + 10 = 32, so 40 − 32 = 8 study neither.`,`P(Physics but not Chemistry) = Physics only ÷ total = 14/40.`,`= 7/20.`],a:`7/20`,t:`22 includes the 8 who study both, so do not use 22.`},
{n:47,m:3,q:`<p>Prove that (2n + 1)² − (2n − 1)² is a multiple of 8 for all positive integers n. (3)</p>`,s:[`Expand the first bracket: (2n + 1)² = 4n² + 4n + 1.`,`Expand the second: (2n − 1)² = 4n² − 4n + 1.`,`Subtract: (4n² + 4n + 1) − (4n² − 4n + 1) = 4n² + 4n + 1 − 4n² + 4n − 1 = 8n.`,`8n = 8 × n, and n is an integer, so the result is a multiple of 8 for all positive integers n.`],a:`8n, which is a multiple of 8`},
{n:48,m:3,q:`<p>Simplify fully (x² − 9) / (x² + x − 6) (3)</p>`,s:[`Numerator: x² − 9 is a difference of two squares, so it equals (x − 3)(x + 3).`,`Denominator x² + x − 6: a × c = −6. Two numbers that multiply to −6 and add to +1 are +3 and −2.`,`Split the middle term: x² + 3x − 2x − 6. Factorise in pairs: x(x + 3) − 2(x + 3) = (x − 2)(x + 3).`,`Write the fraction with the factors: (x − 3)(x + 3) / (x − 2)(x + 3).`,`Cancel the common factor (x + 3): (x − 3)/(x − 2).`],a:`(x − 3)/(x − 2)`},
{n:49,m:3,q:`<p>Make x the subject of y = √((x + 3) / 2) (3)</p>`,s:[`Undo the square root by squaring both sides: y² = (x + 3)/2.`,`Undo the division by multiplying both sides by 2: 2y² = x + 3.`,`Undo the +3 by subtracting 3: x = 2y² − 3.`],a:`x = 2y² − 3`},
{n:50,m:3,q:`<p>Here are the first five terms of a quadratic sequence:<br>5 &nbsp; 2 &nbsp; −3 &nbsp; −10 &nbsp; −19<br>Find an expression, in terms of n, for the nth term of this sequence. (3)</p>`,s:[`First differences: −3, −5, −7, −9.`,`Second differences: −2, −2, −2, so a = −2 ÷ 2 = −1 and the sequence starts with −n².`,`Subtract −n² (−1, −4, −9, −16, −25) from the terms: 5 − (−1) = 6, 2 − (−4) = 6, −3 − (−9) = 6, and so on.`,`Every remainder is 6, so the constant is +6.`,`nth term = −n² + 6 (or 6 − n²).`],a:`6 − n²`},
{n:51,m:2,q:`<p>Triangle A has vertex P at (3, 1). Triangle A is enlarged by scale factor −2, centre the origin, to give triangle B.</p><p>Work out the coordinates of the image of P. (2)</p>`,s:[`Centre the origin, scale factor −2: multiply each coordinate by −2.`,`x: 3 × (−2) = −6.`,`y: 1 × (−2) = −2.`,`The image of P is (−6, −2). A negative scale factor puts the image on the opposite side of the origin.`],a:`(−6, −2)`},
{n:52,m:3,q:`<p>Solve sin x = 0.5 for 0° ≤ x ≤ 360°. Give both solutions. (3)</p>`,s:[`Use inverse sine: x = sin⁻¹(0.5) = 30°. (You should know sin 30° = 0.5 without a calculator.)`,`The sine graph is symmetrical about 90°, so the second solution is 180° − 30° = 150°.`,`Check: sin 150° = 0.5 ✓`,`Solutions: x = 30° and x = 150°.`],a:`x = 30° and x = 150°`},
{n:53,m:2,q:`<p>Without using a calculator, work out the exact value of cos 30° × tan 60°. Give your answer in its simplest form. (2)</p>`,s:[`Exact values: cos 30° = √3/2 and tan 60° = √3.`,`Multiply: (√3/2) × √3 = (√3 × √3)/2.`,`√3 × √3 = 3, so the answer is 3/2.`],a:`3/2`},
{n:54,m:3,q:`<p>O is the origin. OA = a and OB = b. C is a point on AB such that AC : CB = 1 : 2.</p><p>Find OC in terms of a and b. Give your answer in its simplest form. (3)</p>`,s:[`AC : CB = 1 : 2, so AC is 1 part out of 3: AC = ⅓AB.`,`AB = −a + b = b − a, so AC = ⅓(b − a).`,`OC = OA + AC = a + ⅓(b − a).`,`= a + ⅓b − ⅓a = ⅔a + ⅓b.`,`OC = ⅓(2a + b).`],a:`OC = ⅓(2a + b)`},
{n:55,m:2,q:`<p>A metal cylinder has a density of 8.5 g/cm³ and a volume of 40 cm³.</p><p>Work out the mass of the cylinder in kilograms. (2)</p>`,s:[`Density = mass ÷ volume, so mass = density × volume.`,`Mass = 8.5 × 40 = 340 g.`,`Convert to kilograms: 340 ÷ 1000 = 0.34 kg.`],a:`0.34 kg`,t:`The question asks for kilograms, so 340 on its own loses a mark.`},
{n:56,m:3,q:`<p>Solve (x + 3)/2 − (x − 1)/3 = 2 (3)</p>`,s:[`Multiply every term by the common denominator 6: 6 × (x + 3)/2 − 6 × (x − 1)/3 = 6 × 2.`,`Simplify: 3(x + 3) − 2(x − 1) = 12.`,`Expand (take care with the minus sign): 3x + 9 − 2x + 2 = 12.`,`Collect like terms: x + 11 = 12.`,`x = 1. Check: (1 + 3)/2 − (1 − 1)/3 = 2 − 0 = 2 ✓`],a:`x = 1`},
{n:57,m:3,q:`<p>Prove that x² − 6x + 10 is always positive for all real values of x. (3)</p>`,s:[`Complete the square: half of −6 is −3, so x² − 6x + 10 = (x − 3)² + k.`,`(x − 3)² = x² − 6x + 9, so k = 10 − 9 = 1.`,`x² − 6x + 10 = (x − 3)² + 1.`,`A squared number is never negative, so (x − 3)² ≥ 0 and (x − 3)² + 1 ≥ 1.`,`So the expression is always at least 1, which is always positive.`],a:`(x − 3)² + 1 ≥ 1 > 0`},
{n:58,m:3,q:`<p>A circle has equation x² + y² = 49.</p><p><b>(a)</b> Write down the centre and radius of the circle. (1)</p><p><b>(b)</b> Determine, showing your working, whether the point (5, 2√6) lies on the circle. (2)</p>`,s:[`<b>(a)</b> x² + y² = r² has centre (0, 0) and radius r. Here r² = 49, so r = 7.`,`<b>(a)</b> Centre (0, 0), radius 7.`,`<b>(b)</b> Substitute the point into x² + y²: 5² + (2√6)² = 25 + 4 × 6 = 25 + 24 = 49.`,`<b>(b)</b> 49 equals r², so the point (5, 2√6) <b>does</b> lie on the circle.`],a:`(a) centre (0, 0), radius 7 (b) yes, it lies on the circle`},
{n:59,m:2,q:`<p>The graph of y = f(x) is transformed.</p><p><b>(a)</b> Describe fully the single transformation that maps y = f(x) onto y = f(x) + 3. (1)</p><p><b>(b)</b> Describe fully the single transformation that maps y = f(x) onto y = f(x − 2). (1)</p>`,s:[`<b>(a)</b> Adding 3 outside the bracket, y = f(x) + 3, moves every point up by 3.`,`<b>(a)</b> It is a <b>translation</b> by the vector (0, 3) (0 across, 3 up).`,`<b>(b)</b> A change inside the bracket affects x, and it works the opposite way to the sign: f(x − 2) moves the graph 2 to the <b>right</b>.`,`<b>(b)</b> It is a <b>translation</b> by the vector (2, 0).`],a:`(a) translation by (0, 3) (b) translation by (2, 0)`},
{n:60,m:3,q:`<p>In a group of 50 people, 30 like tea (A) and 25 like coffee (B). 45 people like tea or coffee (or both).</p><p>Work out the probability that a person chosen at random likes both tea and coffee. (3)</p>`,s:[`Use P(A or B) = P(A) + P(B) − P(A and B).`,`P(A or B) = 45/50, P(A) = 30/50 and P(B) = 25/50.`,`45/50 = 30/50 + 25/50 − P(A and B), so P(A and B) = 55/50 − 45/50 = 10/50.`,`P(A and B) = 10/50 = 1/5.`,`(Venn check: both = 30 + 25 − 45 = 10 people.)`],a:`1/5`},
{n:61,m:2,q:`<p>A force of 150 N acts on an area of 0.06 m². Using the formula pressure = force ÷ area, work out the pressure. Give your answer in kilopascals (kPa). (2)</p>`,s:[`Pressure = force ÷ area = 150 ÷ 0.06.`,`150 ÷ 0.06 = 2500 N/m² (pascals, Pa).`,`1 kPa = 1000 Pa, so 2500 ÷ 1000 = 2.5.`,`Pressure = 2.5 kPa.`],a:`2.5 kPa`},
{n:62,m:3,q:`<p>A circle has radius 8 cm, correct to the nearest cm. Using π = 3.14, work out the upper bound for the area of the circle. Give your answer correct to 3 significant figures. (3)</p>`,s:[`Nearest cm means ±0.5 cm, so the upper bound for the radius is 8.5 cm.`,`Area = πr². A larger radius gives a larger area, so use 8.5.`,`Area = 3.14 × 8.5² = 3.14 × 72.25 = 226.865.`,`Upper bound = 227 cm² (3 s.f.)`],a:`227 cm²`}];

43:h4('The idea',`<p>A rounded measurement could be anywhere in a small interval. The <b>bounds</b> are the ends of that interval: half a unit below and above.</p>`)+h4('Upper bound of a speed',`<p>Speed = distance ÷ time. For the <b>biggest</b> speed use the biggest distance and the <b>smallest</b> time.</p>`)+eg(`<b>Example:</b> 200 m (nearest 10 m) in 25 s (nearest second). Upper = 205 ÷ 24.5 = 8.37 m/s.`)+h4('Common mistakes',`<p>Using the same bound for both, or ±5 instead of ±2.5 for “nearest 5”.</p>`),
44:h4('The idea',`<p>Two vectors are <b>parallel</b> when one is a multiple of the other. To prove lines are parallel, write both as vectors and show a scalar multiple.</p>`)+h4('Method',`<p>1. Find OM and ON using the midpoint (half).<br>2. MN = −OM + ON.<br>3. AB = −OA + OB.<br>4. Compare: MN = ½AB, so they are parallel and MN is half the length.</p>`)+eg(`<b>Example:</b> OP = 6p, OQ = 6q. S, T are midpoints of OP, OQ. ST = −3p + 3q = 3(q − p). PQ = −6p + 6q = 6(q − p). So ST = ½PQ.`)+h4('Common mistakes',`<p>Sign slips when going backwards, saying “parallel” without showing the multiple, and writing the ratio the wrong way round.</p>`),
45:h4('The rules',`<p>Same base: <b>add</b> powers to multiply, <b>subtract</b> powers to divide.</p>`)+eg(`<b>Example:</b> (y⁵ × y⁻²) ÷ y⁻³ = y³ ÷ y⁻³ = y³⁻⁽⁻³⁾ = y⁶.`)+h4('Common mistakes',`<p>Subtracting a negative power as if it were positive (3 − (−3) is 6, not 0), and multiplying the powers.</p>`),
46:h4('The idea',`<p>A Venn diagram sorts people into groups. The overlap is people in <b>both</b> groups.</p>`)+h4('Method',`<p>1. Put the “both” number in the overlap.<br>2. Subtract it from each total to get “only” numbers.<br>3. Work out how many are in neither.<br>4. Probability = wanted ÷ total.</p>`)+eg(`<b>Example:</b> 30 students: 18 football, 12 tennis, 5 both. Football only = 13. P(football but not tennis) = 13/30.`)+h4('Common mistakes',`<p>Using the whole circle total (it includes the overlap) and dividing by the wrong total.</p>`),
47:h4('The idea',`<p>A proof must work for every value, so use algebra, not examples. Expand, simplify and show the form.</p>`)+eg(`<b>Example:</b> Prove (n + 3)² − (n − 3)² is a multiple of 12.<br>(n² + 6n + 9) − (n² − 6n + 9) = 12n = 12 × n ✓`)+h4('Common mistakes',`<p>Writing (a + b)² = a² + b², sign errors when subtracting a bracket, and not writing a conclusion.</p>`),
48:h4('The idea',`<p>Simplify an algebraic fraction by factorising the top and bottom, then cancelling common <b>brackets</b>.</p>`)+h4('Factorising helpers',`<p><b>Difference of two squares:</b> x² − 16 = (x + 4)(x − 4).<br><b>Quadratics:</b> use the a × c method.</p>`)+eg(`<b>Example:</b> (x² − 16)/(x² + 2x − 8) = (x − 4)(x + 4) / (x + 4)(x − 2) = (x − 4)/(x − 2).`)+h4('Common mistakes',`<p>Cancelling single terms (such as the x’s), and not factorising completely.</p>`),
49:h4('The idea',`<p>Treat it like unwrapping a parcel: undo the last operation first.</p>`)+eg(`<b>Example:</b> y = √(2x + 1).<br>Square both sides: y² = 2x + 1.<br>Subtract 1: y² − 1 = 2x.<br>Divide by 2: x = (y² − 1)/2.`)+h4('Common mistakes',`<p>Squaring only part of a side, and undoing the operations in the wrong order.</p>`),
50:h4('The idea',`<p>In a quadratic sequence the differences change but the <b>second difference</b> is constant. The n² coefficient is half of it (and can be negative).</p>`)+h4('Method',`<p>1. First differences, then second differences.<br>2. a = second difference ÷ 2.<br>3. Subtract an² from every term.<br>4. Find the nth term of what is left.</p>`)+eg(`<b>Example:</b> 7, 12, 19, 28. Differences 5, 7, 9; second difference 2, so a = 1. Subtract n²: 6, 8, 10, 12 which is 2n + 4. nth term = n² + 2n + 4.`)+h4('Common mistakes',`<p>Forgetting a negative sign on a, and using the whole second difference instead of half.</p>`),
51:h4('The idea',`<p>An enlargement changes size from a centre point. With the centre at the origin you multiply the coordinates.</p>`)+eg(`<b>Example:</b> Q(2, −3), scale factor −3, centre O: image (2 × −3, −3 × −3) = (−6, 9). The negative factor flips the point to the opposite side of O.`)+h4('Common mistakes',`<p>Only changing one coordinate, and losing the negative sign.</p>`),
52:h4('Two solutions',`<p>Calculator gives the first solution. The sine curve is symmetrical about 90°, so the second is 180° − x.</p>`)+eg(`<b>Example:</b> sin x = −0.5. The calculator gives −30°, so use 180° + 30° = 210° and 360° − 30° = 330°.<br><b>For cos x = 0.5:</b> x = 60° and 360° − 60° = 300°.`)+h4('Common mistakes',`<p>Giving only one answer, mixing up the sine and cosine rules for the second answer, and having the calculator in radians.</p>`),
53:h4('Exact values to learn',`<p>Learn these two triangles. In the 30°–60°–90° triangle the sides are 1, √3, 2. In the 45° triangle they are 1, 1, √2.</p>`)+eg(`sin 30° = ½, cos 30° = √3/2, tan 30° = 1/√3<br>sin 60° = √3/2, cos 60° = ½, tan 60° = √3<br>sin 45° = √2/2, cos 45° = √2/2, tan 45° = 1`)+eg(`<b>Example:</b> sin 60° × tan 45° = √3/2 × 1 = √3/2.`)+h4('Common mistakes',`<p>Mixing sin and cos for 30° and 60°, and using a calculator when the question says exact.</p>`),
54:h4('The idea',`<p>A ratio along a line splits it into parts. AC : CB = 1 : 2 means 3 parts, and AC is 1 of them.</p>`)+eg(`<b>Example:</b> AC : CB = 2 : 3, so AC = ⅖AB. OC = a + ⅖(b − a) = ⅗a + ⅖b.`)+h4('Common mistakes',`<p>Using ½ or ⅔ instead of ⅓, and mixing up a and b.</p>`),
55:h4('The idea',`<p>Density tells you how much mass is in each cm³. The DMV triangle links them.</p>`)+eg(`<b>Example:</b> mass 120 g, volume 15 cm³: density = 120 ÷ 15 = 8 g/cm³. For mass: 8 × 15 = 120 g = 0.12 kg.`)+h4('Common mistakes',`<p>Dividing instead of multiplying, and forgetting to change grams to kilograms.</p>`),
56:h4('The idea',`<p>Clear the fractions first by multiplying <b>every</b> term by a common multiple of the denominators.</p>`)+eg(`<b>Example:</b> (x + 1)/2 + (x − 2)/4 = 3.<br>×4: 2(x + 1) + (x − 2) = 12<br>2x + 2 + x − 2 = 12, 3x = 12, x = 4.`)+h4('Common mistakes',`<p>Not multiplying the right-hand side, and sign errors when expanding after a minus.</p>`),
57:h4('The idea',`<p>To prove an expression is always positive, complete the square. A square is never negative, so adding a positive number keeps it positive.</p>`)+eg(`<b>Example:</b> x² + 4x + 7 = (x + 2)² + 3 ≥ 3, so always positive.`)+h4('Common mistakes',`<p>Getting the constant wrong, and not writing the final sentence.</p>`),
58:h4('The idea',`<p>x² + y² = r² is the equation of a circle with centre the origin and radius r.</p>`)+eg(`<b>Example:</b> x² + y² = 25, radius 5. Point (3, 4): 9 + 16 = 25 so it is on the circle. Point (2, 5): 4 + 25 = 29, not 25, so it is outside.`)+h4('Common mistakes',`<p>Saying the radius is 49 (it is √49 = 7), and squaring a surd wrongly: (2√6)² = 4 × 6 = 24, not 12.</p>`),
59:h4('Inside or outside the bracket?',`<p><b>Outside</b> (y = f(x) + a): moves up or down, in the same direction as the sign. <b>Inside</b> (y = f(x − a)): moves left or right, <b>opposite</b> to the sign.</p>`)+eg(`y = f(x) − 4: translation (0, −4).<br>y = f(x + 1): translation (−1, 0).`)+h4('Common mistakes',`<p>Saying f(x − 2) moves left, and forgetting to name the transformation and give the vector.</p>`),
60:h4('The idea',`<p>P(A or B) counts everyone who likes A, B or both. Adding P(A) and P(B) counts the overlap twice, so subtract it once.</p>`)+eg(`<b>Example:</b> 40 people. 25 swim, 20 run, 30 do at least one. Both = 25 + 20 − 30 = 15. P = 15/40 = 3/8.`)+h4('Common mistakes',`<p>Forgetting to subtract, and mixing up “or” with “and”.</p>`),
61:h4('The idea',`<p>Pressure is how hard a force pushes on each square metre.</p>`)+eg(`<b>Example:</b> 400 N on 0.5 m²: pressure = 400 ÷ 0.5 = 800 Pa = 0.8 kPa.`)+h4('Common mistakes',`<p>Not converting Pa to kPa (divide by 1000), and dividing area by force.</p>`),
62:h4('Upper bound of an area',`<p>The area of a circle grows as the radius grows, so the upper bound of the area uses the upper bound of the radius.</p>`)+eg(`<b>Example:</b> radius 5 cm to the nearest cm, π = 3.14. Upper radius 5.5. Area = 3.14 × 5.5² = 94.985 = 95.0 cm² (3 s.f.).`)+h4('Common mistakes',`<p>Using 8 instead of 8.5, using ±0.05 instead of ±0.5, and rounding before the final answer.</p>`)};

$('card').innerHTML=`<h2>📄 Formula sheet guide</h2><div class="fsb fs-no"><b>Read this first</b><p>In the exam you get a short formula sheet, printed as an insert with your paper. <b>Most of the formulas you need are NOT on it.</b> Everything marked 🧠 below you must <b>learn and be able to write from memory before the exam</b>. The sheet gives you a formula, never the method for using it.</p></div>
<h3>Jump to a question (each has a badge)</h3><p class="row">${Q.map(q=>`<button class="alt" onclick="show(${q.n})">${FB[FSK[q.n].st]} Q${q.n}</button>`).join('')}</p><p class="tx2">📄 on the sheet · ⚠️ only partly on the sheet · 🧠 not on the sheet, memorise</p>

<details class="sec"><summary>🧠 NOT on the sheet: memorise these</summary><p class="row"><button id="qz" onclick="fsQuiz()">Test yourself (hide answers)</button><span class="tx2" id="kc"></span></p><div id="fsm">${FSM.map(g=>`<p class="fsg">${g[0]}</p>`+g[1].map(r=>{const k=i++;return`<div class="fsr"><input type="checkbox" aria-label="I know: ${r[0]}" ${ST.know.includes(k)?'checked':''} onchange="fsKnow(${k},this.checked)"><span class="fsn">${r[0]}</span><button class="fsf" onclick="this.classList.toggle('rv')">${r[1]}</button></div>`}).join('')).join('')}</div><p class="tx2">Tick each one when you can write it from memory. In test mode, tap a blurred formula to check yourself.</p></details>
